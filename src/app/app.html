<h1>ShopFlow Products</h1>

<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">

  @for (product of products(); track product.id) {
    <app-product-card
      [product]="product"
      (buy)="handleBuy($event)"
    ></app-product-card>
  }

</div>

@if (selectedProduct) {
  <h2>Selected Product: {{ selectedProduct }}</h2>
}
